location = /processes/ {
    alias /data/processes/;
    autoindex on;
    autoindex_format json;
    autoindex_exact_size on;
    add_header Cache-Control "no-store" always;
    limit_except GET { deny all; }
}

location ~* ^/processes/[^/]+/manifest\.xml$ {
    return 404;
}

location ~ ^/processes/(?<listing_app>[A-Za-z0-9][A-Za-z0-9._-]*)/$ {
    alias /data/processes/$listing_app/;
    autoindex on;
    autoindex_format json;
    autoindex_exact_size on;
    add_header Cache-Control "no-store" always;
    limit_except GET { deny all; }
}

location ~ ^/processes/(?<file_app>[A-Za-z0-9][A-Za-z0-9._-]*)/(?<process_file>[A-Za-z0-9][A-Za-z0-9._-]*\.xml)$ {
    alias /data/processes/$file_app/$process_file;
    dav_methods PUT;
    dav_access user:rw group:rw all:r;
    client_max_body_size 0;
    add_header Cache-Control "no-store" always;
    limit_except GET PUT { deny all; }
}
