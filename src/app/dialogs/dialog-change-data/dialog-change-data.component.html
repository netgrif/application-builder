<h2 mat-dialog-title>Change referenced data value{{dataSet.length > 1 ? 's' : ''}}</h2>
<mat-dialog-content class="netgrif-input">
    <mat-form-field fxFlex *ngFor="let data of dataSet; let i = index">
        <mat-label>{{data.id}}</mat-label>
        <input type="number" step="1" min="0" matInput [formControl]="getControl(i)">

        <mat-error *ngIf="getControl(i).errors?.required">Value is required</mat-error>
        <mat-error *ngIf="getControl(i).errors?.validValue">Value can not be a negative number</mat-error>
    </mat-form-field>
    <span *ngIf="dataSet.length === 0">No referenced data found</span>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-flat-button color="primary" [mat-dialog-close]="onSave()" [disabled]="formArray.invalid">
        <mat-icon>done</mat-icon>
        <span>Save</span>
    </button>
</mat-dialog-actions>
