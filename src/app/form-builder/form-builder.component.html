<mat-sidenav class="app-mat-sidenav"
             [mode]="isMobile ? 'over' : 'side'"
             fixedInViewport=true
             disableClose="true"
             [opened]="!isMobile || mobilePane === 'fields'">
    <nab-field-list></nab-field-list>
</mat-sidenav>

<main class="form-canvas">
    <nab-info-label></nab-info-label>
    <nab-paper-component></nab-paper-component>
</main>

<mat-sidenav mwlResizable
             (resizing)="onResizeEvent($event)"
             [style.width.px]="width"
             fixedInViewport=true
             disableClose="true"
             style="max-width: 450px;"
             class="app-mat-sidenav-right"
             [mode]="isMobile ? 'over' : 'side'"
             position="end"
             [opened]="!isMobile || mobilePane === 'properties'">
    <div fxLayout="row">
        <div class="handle" mwlResizeHandle [resizeEdges]="{ left: true }"></div>
        <nab-edit-panel fxFlex></nab-edit-panel>
    </div>
</mat-sidenav>

<nav class="mobile-form-navigation" aria-label="Form builder panels">
    <button mat-button
            [class.active]="mobilePane === 'fields'"
            (click)="showMobilePane('fields')">
        <mat-icon>view_list</mat-icon>
        Fields
    </button>
    <button mat-button
            [class.active]="mobilePane === 'canvas'"
            (click)="showMobilePane('canvas')">
        <mat-icon>dashboard</mat-icon>
        Canvas
    </button>
    <button mat-button
            [class.active]="mobilePane === 'properties'"
            (click)="showMobilePane('properties')">
        <mat-icon>tune</mat-icon>
        Properties
    </button>
</nav>
